name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "URL ZIP project (dari release)"
        required: true
      tag:
        description: "Tag release"
        required: true
      build_mode:
        description: "release / debug"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Download & Extract Project
        run: |
          mkdir -p project
          curl -L "${{ github.event.inputs.project_url }}" -o project.zip
          unzip -q project.zip -d project
          ls -la project

      - name: Find pubspec.yaml
        id: find_pubspec
        run: |
          PUBSPEC=$(find project -name "pubspec.yaml" -type f | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          ROOT=$(dirname "$PUBSPEC")
          echo "project_root=$ROOT" >> $GITHUB_OUTPUT
          echo "Root: $ROOT"

      - name: Flutter pub get
        working-directory: ${{ steps.find_pubspec.outputs.project_root }}
        run: flutter pub get

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_mode == 'release' }}
        working-directory: ${{ steps.find_pubspec.outputs.project_root }}
        run: flutter build apk --release

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.build_mode == 'debug' }}
        working-directory: ${{ steps.find_pubspec.outputs.project_root }}
        run: flutter build apk --debug

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find project -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 1
